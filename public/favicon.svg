<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1633"/>
      <stop offset="100%" stop-color="#060b18"/>
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Green Dot Glow -->
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Square Body -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgGrad)" stroke="#00e5ff" stroke-width="4.5" stroke-opacity="0.85" filter="url(#cyanGlow)" />

  <!-- Phone Handset Icon (Vector Path) -->
  <path d="M35 30 C35 27 37 25 40 26 L48 29 C50 30 51 32 50 35 L47 40 C46 41 46 43 48 45 L55 52 C57 54 59 54 60 53 L65 50 C68 49 70 50 71 52 L74 60 C75 63 73 65 70 65 C52 65 35 48 35 30 Z" 
        fill="#00e5ff" 
        fill-opacity="0.25" 
        stroke="#00e5ff" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Live Active Dot (Emerald Green) -->
  <circle cx="76" cy="24" r="8" fill="#10b981" filter="url(#greenGlow)" stroke="#060b18" stroke-width="2.5" />
</svg>
